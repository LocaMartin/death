# sensitive-grep-rules.yaml
grep_rules:
  - name: API Key
    pattern: '(?i)(api[_-]?key|apikey|x-api-key)[\'"\s:=]+[\'"]?[a-z0-9]{16,45}[\'"]?'
    description: Generic API keys found in JS, JSON, or env variables.

  - name: AWS Access Key
    pattern: 'AKIA[0-9A-Z]{16}'
    description: AWS Access Key ID.

  - name: AWS Secret Key
    pattern: '(?i)aws(.{0,20})?(secret|access)[\'"\s:=]+[\'"]?[a-z0-9A-Z/+]{40}[\'"]?'
    description: AWS secret access key.

  - name: Google API Key
    pattern: 'AIza[0-9A-Za-z\\-_]{35}'
    description: Google Cloud API key.

  - name: Private RSA Key
    pattern: '-----BEGIN RSA PRIVATE KEY-----'
    description: Start of a private RSA key block.

  - name: JWT Token
    pattern: 'eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'
    description: JSON Web Token often found in storage or headers.

  - name: Database URL
    pattern: '(?i)(mysql|postgres|mongodb|mariadb|sqlserver):\/\/[^\'"\s]+'
    description: Exposed database connection strings.

  - name: Email and Password in Code
    pattern: '[\'"]?[\w.+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}[\'"]?\s*[:=]\s*[\'"][^\'"]{4,50}[\'"]'
    description: Hardcoded email and password pair.

  - name: Firebase URL
    pattern: 'https:\/\/[a-z0-9-]+\.firebaseio\.com'
    description: Firebase Realtime DB endpoint.

  - name: Generic Password Variable
    pattern: '(?i)(pass(word)?|pwd)[\'"\s:=]+[\'"]?[^\'"\s]{4,50}[\'"]?'
    description: Hardcoded password variable.

  - name: Secret or Token
    pattern: '(?i)(secret|token|auth)[\'"\s:=]+[\'"]?[a-z0-9_\-]{8,100}[\'"]?'
    description: Generic secret or token.

  - name: Slack Webhook
    pattern: 'https:\/\/hooks\.slack\.com\/services\/[A-Za-z0-9]+\/[A-Za-z0-9]+\/[A-Za-z0-9]+'
    description: Slack incoming webhook URL.

  - name: Google OAuth Client ID
    pattern: '[0-9]{12}-[a-z0-9]{32}\.apps\.googleusercontent\.com'
    description: Google OAuth 2.0 Client ID.
